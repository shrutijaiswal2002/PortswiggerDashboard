<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>WebSec Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; scroll-behavior: smooth; color-scheme: dark; }
:root {
  --black:#060608; --bg:#0d1017; --surface:#131720; --lift:#1a2030;
  --border:#1f2937; --border2:#2d3748; --muted:#4b5563; --dim:#6b7280;
  --body:#9ca3af; --text:#e5e7eb; --white:#f0f4f8;
  --green:#00ff88; --green2:#00cc6a; --red:#ff4d4d; --orange:#ff9500;
  --yellow:#ffd60a; --blue:#3b9eff; --purple:#a855f7;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:4px;
}
body {
  font-family:var(--sans); background:var(--black); color:var(--text);
  height:100%; overflow:hidden; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#topbar {
  flex-shrink:0; min-height:48px; background:var(--bg); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:6px 16px; gap:12px; z-index:50; flex-wrap:wrap;
}
.wordmark { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--green); white-space:nowrap; }
.wordmark span { color:var(--dim); }
.search-box { flex:1; min-width:160px; max-width:400px; position:relative; }
.search-box input {
  width:100%; height:32px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); color:var(--text); font-family:var(--mono); font-size:12px;
  padding:0 12px 0 30px; outline:none; transition:border-color .15s;
}
.search-box input:focus { border-color:var(--green); }
.search-box input::placeholder { color:var(--muted); }
.search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; pointer-events:none; }
#search-drop {
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius); z-index:200; overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
#search-drop.open { display:block; }
.sdrop-item { display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--border); }
.sdrop-item:last-child { border-bottom:none; }
.sdrop-item:hover { background:var(--lift); }
.si-icon { font-size:16px; flex-shrink:0; }
.si-name { font-family:var(--mono); font-size:12px; color:var(--text); }
.si-desc { font-size:11px; color:var(--dim); }
.top-actions { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
.chip {
  font-family:var(--mono); font-size:11px; padding:4px 10px; border-radius:2px;
  border:1px solid var(--border); background:none; color:var(--dim); cursor:pointer; transition:all .15s;
}
.chip:hover { border-color:var(--border2); color:var(--text); }
.chip.active { border-color:var(--green); color:var(--green); background:rgba(0,255,136,.06); }

#shell { flex:1; display:flex; overflow:hidden; min-height:0; }
#sidebar { width:236px; flex-shrink:0; background:var(--bg); border-right:1px solid var(--border); overflow-y:auto; overflow-x:hidden; }
#sidebar::-webkit-scrollbar, #main::-webkit-scrollbar { width:6px; }
#sidebar::-webkit-scrollbar-thumb, #main::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.sb-section { padding:14px 0 4px; }
.sb-label { font-family:var(--mono); font-size:10px; color:var(--muted); padding:0 14px 6px; display:block; letter-spacing:.5px; text-transform:lowercase; }
.sb-item {
  display:flex; align-items:center; gap:9px; padding:7px 14px; cursor:pointer; border:none; background:none;
  width:100%; text-align:left; color:var(--body); font-family:var(--sans); font-size:13px;
  border-left:2px solid transparent; transition:all .12s;
}
.sb-item:hover { background:var(--surface); color:var(--text); }
.sb-item.active { background:var(--surface); color:var(--text); border-left-color:var(--green); }
.sb-item .si { font-size:15px; flex-shrink:0; }
.sb-item .sname { flex:1; line-height:1.3; }
.sb-sev { font-family:var(--mono); font-size:9px; padding:1px 5px; border-radius:2px; flex-shrink:0; }
.sev-critical { background:rgba(255,77,77,.15); color:#ff6b6b; }
.sev-high { background:rgba(255,149,0,.15); color:#ff9500; }
.sev-medium { background:rgba(255,214,10,.15); color:#ffd60a; }

#main { flex:1; overflow-y:auto; overflow-x:hidden; background:var(--black); min-width:0; }
#index-view { padding:24px 28px; }
#index-view.off { display:none; }
.index-header h1 { font-family:var(--mono); font-size:22px; font-weight:600; color:var(--white); margin-bottom:8px; }
.index-header h1 span { color:var(--green); }
.index-header p { font-size:14px; color:var(--dim); max-width:560px; line-height:1.6; }
.index-meta { display:flex; gap:24px; margin:16px 0 24px; flex-wrap:wrap; }
.imeta-item { display:flex; align-items:center; gap:8px; }
.imeta-item .num { font-family:var(--mono); font-size:20px; font-weight:600; color:var(--green); }
.imeta-item .lbl { font-size:12px; color:var(--dim); }
.topic-table { width:100%; border-collapse:collapse; }
.topic-table thead th { font-family:var(--mono); font-size:10px; color:var(--muted); font-weight:500; text-align:left; padding:8px 12px; border-bottom:1px solid var(--border); }
.topic-table tbody tr { border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s; }
.topic-table tbody tr:hover { background:var(--surface); }
.topic-table td { padding:13px 12px; font-size:13px; vertical-align:middle; }
.tt-icon { font-size:20px; text-align:center; width:44px; }
.tt-name { font-weight:600; color:var(--text); display:block; margin-bottom:3px; }
.tt-desc { font-size:12px; color:var(--dim); line-height:1.4; }
.tt-tags { display:flex; gap:5px; flex-wrap:wrap; }
.tag-pill { font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:2px; background:var(--lift); color:var(--dim); border:1px solid var(--border); }
.tt-arrow { color:var(--muted); font-size:16px; text-align:center; }

#detail-view { display:none; }
#detail-view.on { display:block; }
.det-head { background:var(--bg); border-bottom:1px solid var(--border); padding:20px 28px; display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; }
.det-icon-wrap { width:48px; height:48px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
.det-meta { flex:1; min-width:240px; }
.det-meta h1 { font-family:var(--mono); font-size:18px; font-weight:600; color:var(--white); margin-bottom:6px; }
.ddesc { font-size:13px; color:var(--body); line-height:1.6; max-width:680px; }
.det-badges { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.badge { font-family:var(--mono); font-size:10px; padding:3px 9px; border-radius:2px; border:1px solid transparent; }
.back-btn { font-family:var(--mono); font-size:11px; color:var(--dim); background:none; border:1px solid var(--border); border-radius:var(--radius); padding:6px 12px; cursor:pointer; white-space:nowrap; margin-top:3px; }
.back-btn:hover { color:var(--text); border-color:var(--border2); }
.tab-bar { display:flex; background:var(--bg); border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; padding:0 20px; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn { font-family:var(--mono); font-size:12px; padding:12px 16px; border:none; background:none; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.tab-btn:hover { color:var(--text); }
.tab-btn.on { color:var(--green); border-bottom-color:var(--green); }
.tab-pane { padding:24px 28px 60px; }
.sec-title { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--white); margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.prose-p { font-size:14px; color:var(--body); line-height:1.75; margin-bottom:14px; max-width:700px; }
.prose-p a, .callout a { color:var(--blue); text-decoration:none; }
.flow-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:16px 0; overflow-x:auto; }
.flow-title { font-family:var(--mono); font-size:10px; color:var(--muted); margin-bottom:12px; letter-spacing:.5px; }
.flow-nodes { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.fn { font-family:var(--mono); font-size:11px; padding:6px 12px; border-radius:3px; border:1px solid; white-space:nowrap; }
.fn-arrow { color:var(--muted); font-size:16px; }
.fn-a { background:rgba(255,77,77,.1); color:#ff9090; border-color:rgba(255,77,77,.3); }
.fn-v { background:rgba(255,149,0,.1); color:#ffaa44; border-color:rgba(255,149,0,.3); }
.fn-x { background:rgba(255,214,10,.1); color:#ffd60a; border-color:rgba(255,214,10,.3); }
.fn-s { background:rgba(59,158,255,.1); color:#7ab8ff; border-color:rgba(59,158,255,.3); }
.fn-i { background:rgba(255,77,77,.1); color:#ff9090; border-color:rgba(255,77,77,.3); }
.fn-db { background:rgba(168,85,247,.1); color:#c084fc; border-color:rgba(168,85,247,.3); }
.callout { display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-radius:var(--radius); font-size:13px; line-height:1.6; margin:14px 0; max-width:720px; }
.callout-warn { background:rgba(255,149,0,.07); border:1px solid rgba(255,149,0,.25); color:#ffaa44; }
.callout-tip { background:rgba(0,255,136,.05); border:1px solid rgba(0,255,136,.2); color:#00cc6a; }
.callout-info { background:rgba(59,158,255,.07); border:1px solid rgba(59,158,255,.25); color:#7ab8ff; }
.callout-red { background:rgba(255,77,77,.07); border:1px solid rgba(255,77,77,.25); color:#ff9090; }
.callout-icon { flex-shrink:0; font-weight:700; }
.ex-block { margin-bottom:26px; }
.ex-title { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--text); margin-bottom:8px; }
.code-wrap { max-width:820px; }
.code-header { display:flex; align-items:center; justify-content:space-between; background:var(--lift); border:1px solid var(--border); border-bottom:none; border-radius:var(--radius) var(--radius) 0 0; padding:7px 14px; }
.code-lang { font-family:var(--mono); font-size:10px; color:var(--muted); }
.code-label-good { color:var(--green); }
.code-label-atk { color:var(--orange); }
.copy-code-btn { font-family:var(--mono); font-size:10px; background:none; border:none; color:var(--muted); cursor:pointer; padding:2px 6px; }
.copy-code-btn:hover { color:var(--text); }
.code-body { background:#090d13; border:1px solid var(--border); border-radius:0 0 var(--radius) var(--radius); overflow-x:auto; padding:14px 16px; }
.code-body pre { font-family:var(--mono); font-size:12px; line-height:1.7; color:#c9d1d9; white-space:pre; }
.checklist { display:flex; flex-direction:column; gap:8px; margin:12px 0; max-width:700px; }
.cl-item { display:flex; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; font-size:13px; color:var(--body); line-height:1.5; }
.cl-item .ci { color:var(--green); flex-shrink:0; }
.types-list { display:flex; flex-direction:column; gap:8px; max-width:700px; }
.type-row { padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-left:3px solid; border-radius:0 var(--radius) var(--radius) 0; }
.tr-name { color:var(--text); font-weight:500; font-size:13px; margin-bottom:2px; }
.tr-desc { font-size:12px; color:var(--dim); line-height:1.5; }
.quiz-wrap { max-width:680px; }
.quiz-prog-bar-outer { height:3px; background:var(--surface); border-radius:2px; margin-bottom:20px; overflow:hidden; }
.quiz-prog-bar-inner { height:100%; background:var(--green); transition:width .3s ease; }
.quiz-scoreline { font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:16px; }
.quiz-q { font-size:15px; font-weight:600; color:var(--white); line-height:1.5; margin-bottom:18px; }
.quiz-opts { display:flex; flex-direction:column; gap:8px; }
.quiz-opt { padding:11px 15px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); font-size:13px; color:var(--text); cursor:pointer; text-align:left; font-family:var(--sans); line-height:1.5; }
.quiz-opt:hover:not(:disabled) { border-color:var(--border2); background:var(--lift); }
.quiz-opt.correct { border-color:var(--green); background:rgba(0,255,136,.07); color:var(--green); }
.quiz-opt.wrong { border-color:var(--red); background:rgba(255,77,77,.07); color:var(--red); }
.quiz-opt:disabled { cursor:default; }
.quiz-exp { margin-top:14px; padding:12px 14px; border-radius:var(--radius); font-size:13px; line-height:1.65; display:none; }
.quiz-exp.show { display:block; }
.quiz-exp.correct { background:rgba(0,255,136,.06); border:1px solid rgba(0,255,136,.2); color:#6ee7b7; }
.quiz-exp.wrong { background:rgba(255,77,77,.06); border:1px solid rgba(255,77,77,.2); color:#fca5a5; }
.quiz-footer { display:flex; justify-content:flex-end; margin-top:16px; min-height:36px; }
.quiz-next-btn { font-family:var(--mono); font-size:12px; padding:8px 18px; background:var(--green); color:var(--black); border:none; border-radius:var(--radius); cursor:pointer; font-weight:600; display:none; }
.quiz-next-btn.show { display:inline-block; }
.quiz-end { text-align:center; padding:32px 20px; }
.big-score { font-family:var(--mono); font-size:48px; font-weight:600; color:var(--white); line-height:1; margin-bottom:8px; }
.score-sub { font-size:14px; color:var(--dim); margin-bottom:20px; }
.retry-btn { font-family:var(--mono); font-size:12px; padding:9px 20px; background:none; border:1px solid var(--green); color:var(--green); border-radius:var(--radius); cursor:pointer; }
.retry-btn:hover { background:rgba(0,255,136,.08); }
.refs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; max-width:860px; }
.ref-card { display:block; text-decoration:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px; }
.ref-card:hover { border-color:var(--border2); }
.ref-src { font-family:var(--mono); font-size:10px; color:var(--muted); margin-bottom:5px; }
.ref-name { font-size:13px; color:var(--text); font-weight:500; line-height:1.4; margin-bottom:6px; }
.ref-url { font-family:var(--mono); font-size:10px; color:var(--blue); }
.divider { height:1px; background:var(--border); margin:20px 0; max-width:720px; }
@media (max-width:760px) {
  body { overflow:auto; height:auto; min-height:100%; }
  #shell { flex-direction:column; overflow:visible; }
  #main { overflow:visible; }
  #sidebar { width:100%; display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--border); }
  .sb-section { display:flex; padding:6px 0; }
  .sb-label { display:none; }
  .sb-item { white-space:nowrap; padding:7px 12px; border-left:none; border-bottom:2px solid transparent; width:auto; }
  .sb-item.active { border-bottom-color:var(--green); }
  .sb-sev { display:none; }
  #index-view, .tab-pane, .det-head { padding-left:16px; padding-right:16px; }
  .tt-tags, .topic-table th:nth-child(3) { display:none; }
}
</style>
</head>

  <div class="wordmark">websec<span>/</span>ref</div>

<script>
const TOPICS = [
{
  id:'sqli', icon:'💉', name:'SQL Injection', group:'server',
  short:'Interfere with database queries to read, modify, or delete data.',
  severity:'critical', sevColor:'#ff4d4d',
  tags:['Database','Auth bypass','UNION','Blind'],
  desc:'SQLi lets attackers manipulate database queries by injecting SQL through unsanitized inputs. Impact ranges from data theft to full database control and server compromise.',
  flow:[{t:"Attacker",c:'fn-a'},{t:"→"},{t:"' OR 1=1--",c:'fn-v'},{t:"→"},{t:"WHERE clause broken",c:'fn-x'},{t:"→"},{t:"DB returns all rows",c:'fn-db'},{t:"→"},{t:"Data exfiltrated",c:'fn-i'}],
  howItWorks:"When an application builds SQL queries by string concatenation, user input becomes part of the query logic. A single quote can break out of the string context and inject arbitrary SQL, which the database executes with the application's privileges.",
  types:[
    {name:"In-band: UNION-based",desc:"UNION SELECT appends results from other tables to the original query's response.",c:'#ff4d4d'},
    {name:"In-band: error-based",desc:"Forces database errors that leak schema info or data in the message.",c:'#ff6b6b'},
    {name:"Blind: boolean",desc:"Asks true/false questions via injected conditions and infers data from response differences.",c:'#ff9500'},
    {name:"Blind: time-based",desc:"Uses SLEEP()/WAITFOR DELAY to confirm injection when responses look identical.",c:'#ffd60a'},
    {name:"Out-of-band",desc:"Exfiltrates data via DNS or HTTP requests to a server you control.",c:'#3b9eff'},
    {name:"Second-order (stored)",desc:"A payload is stored safely, then triggered later when reused unsafely in another query.",c:'#a855f7'}
  ],
  examples:[
    {title:"Retrieving hidden data",kind:"atk",lang:"SQL",code:`-- Normal query:
SELECT * FROM products WHERE category = 'Gifts' AND released = 1

-- Payload: Gifts'--
SELECT * FROM products WHERE category = 'Gifts'--' AND released = 1
--                                                  ^ rest is a comment
-- The released=1 check is gone, so unreleased products appear`},
    {title:"Login bypass",kind:"atk",lang:"SQL",code:`-- Normal query:
SELECT * FROM users WHERE username = 'wiener' AND password = 'bluecheese'

-- Username: administrator'--   Password: (blank)
SELECT * FROM users WHERE username = 'administrator'--' AND password = ''
-- Password check is commented out: logged in as administrator`},
    {title:"UNION attack",kind:"atk",lang:"SQL",code:`-- 1. Find the column count:
' ORDER BY 1--
' ORDER BY 2--
' ORDER BY 3--   (error => the query has 2 columns)

-- 2. Pull data from another table:
' UNION SELECT username, password FROM users--

-- Resulting query:
SELECT name, description FROM products WHERE category = ''
UNION SELECT username, password FROM users--'`},
    {title:"Blind boolean extraction",kind:"atk",lang:"HTTP",code:`-- True condition (normal page):
Cookie: TrackingId=abc' AND SUBSTRING((SELECT password FROM users WHERE username='administrator'),1,1)='a'--
-- False condition (page differs):
Cookie: TrackingId=abc' AND SUBSTRING((SELECT password FROM users WHERE username='administrator'),1,1)='b'--
-- Repeat per character position; automate with Burp Intruder`},
    {title:"Vulnerable vs safe",kind:"good",lang:"Java",code:`// VULNERABLE: string concatenation
String q = "SELECT * FROM products WHERE category = '" + input + "'";
Statement s = connection.createStatement();
ResultSet rs = s.executeQuery(q);

// SAFE: parameterized query
PreparedStatement ps = connection.prepareStatement(
    "SELECT * FROM products WHERE category = ?");
ps.setString(1, input);   // input is data, never SQL
ResultSet rs2 = ps.executeQuery();`}
  ],
  prevention:["Use parameterized queries (prepared statements) for every query that includes input","Use a well-tested ORM, but don't concatenate strings inside it either","Whitelist permitted values where parameters can't be used (column names, ORDER BY)","Give database accounts least privilege (read-only where possible)","The query string must always be a hard-coded constant, never built from variable data"],

    {src:"MDN",name:"Cross-Origin Resource Sharing (CORS)",url:"https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS"},
    {src:"PortSwigger",name:"Exploiting CORS misconfigurations (research)",url:"https://portswigger.net/research/exploiting-cors-misconfigurations-for-bitcoins-and-bounties"}
  ]
},
{

</style>
<div id="decoy_website">...decoy content...</div>
<iframe id="target_website" src="https://vulnerable-website.com"></iframe>`},

    {q:"Why don't CSRF tokens stop clickjacking?",opts:["They do","The request is made on-domain, inside the frame, with a valid token","Tokens only protect GET","Clickjacking ignores cookies"],ans:1,exp:"The victim genuinely interacts with the real site; only framing restrictions help."},

/* ---------- state ---------- */
let currentId = null;
let filterGroup = 'all';
const quizState = {};
function qState(id){ if(!quizState[id]) quizState[id]={q:0,score:0,answered:false}; return quizState[id]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- sidebar / index ---------- */
function buildSidebar(){
  const groups=[{label:'server-side',key:'server'},{label:'client-side',key:'client'},{label:'auth & logic',key:'auth'}];
  let html='';
  groups.forEach(g=>{
    html+='<div class="sb-section"><span class="sb-label">'+g.label+'</span>';
    TOPICS.filter(x=>x.group===g.key).forEach(t=>{
      html+='<button class="sb-item" id="sb-'+t.id+'" onclick="openTopic(\''+t.id+'\')"><span class="si">'+t.icon+'</span><span class="sname">'+t.name+'</span><span class="sb-sev sev-'+t.severity+'">'+t.severity+'</span></button>';
    });
    html+='</div>';
  });
  document.getElementById('sidebar').innerHTML=html;
}
function buildIndex(){
  const rows=TOPICS.filter(t=>filterGroup==='all'||t.group===filterGroup);
  document.getElementById('topic-tbody').innerHTML=rows.map(t=>
    '<tr onclick="openTopic(\''+t.id+'\')"><td class="tt-icon">'+t.icon+'</td><td><span class="tt-name">'+t.name+'</span><span class="tt-desc">'+t.short+'</span></td><td><div class="tt-tags">'+t.tags.slice(0,3).map(x=>'<span class="tag-pill">'+x+'</span>').join('')+'</div></td><td><span class="sb-sev sev-'+t.severity+'">'+t.severity+'</span></td><td class="tt-arrow">&rsaquo;</td></tr>'
  ).join('');
}
function setFilter(g){
  filterGroup=g;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('filter-'+g).classList.add('active');
  buildIndex();
  showIndex();
}
function showIndex(){
  currentId=null;
  document.getElementById('index-view').classList.remove('off');
  document.getElementById('detail-view').classList.remove('on');
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('main').scrollTop=0;
}

/* ---------- topic view ---------- */
function openTopic(id){
  const t=TOPICS.find(x=>x.id===id); if(!t) return;
  currentId=id;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  const sb=document.getElementById('sb-'+id); if(sb) sb.classList.add('active');
  document.getElementById('index-view').classList.add('off');
  document.getElementById('detail-view').classList.add('on');
  document.getElementById('det-head').innerHTML=
    '<button class="back-btn" onclick="showIndex()">&larr; index</button>'+
    '<div class="det-icon-wrap">'+t.icon+'</div>'+
    '<div class="det-meta"><h1>'+t.name+'</h1><p class="ddesc">'+t.desc+'</p><div class="det-badges"><span class="badge sev-'+t.severity+'">'+t.severity+'</span>'+
    t.tags.map(x=>'<span class="badge" style="border-color:'+t.sevColor+'40;color:'+t.sevColor+';background:'+t.sevColor+'12">'+x+'</span>').join('')+'</div></div>';
  const tabs=[['overview','Overview'],['examples','Examples'],['types','Types'],['defense','Defense'],['quiz','Quiz'],['refs','References']];
  document.getElementById('tab-bar').innerHTML=tabs.map((tb,i)=>'<button class="tab-btn'+(i===0?' on':'')+'" id="tbtn-'+tb[0]+'" onclick="switchTab(\''+id+'\',\''+tb[0]+'\')">'+tb[1]+'</button>').join('');
  renderTab(id,'overview');
  document.getElementById('main').scrollTop=0;
  window.scrollTo(0,0);
}
function switchTab(id,key){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('tbtn-'+key).classList.add('on');
  renderTab(id,key);
}
function renderTab(id,key){
  const t=TOPICS.find(x=>x.id===id), tc=document.getElementById('tab-content');
  let h='';
  if(key==='overview'){
    const sevMsg=t.severity==='critical'?'Can lead to full system or data compromise.':t.severity==='high'?'Significant data or account impact.':'Impact depends heavily on the application and chaining with other flaws.';
    h='<p class="sec-title">How it works</p><p class="prose-p">'+t.howItWorks+'</p>'+
      '<div class="flow-wrap"><div class="flow-title">attack flow</div><div class="flow-nodes">'+
      t.flow.map(n=>n.t==='→'?'<span class="fn-arrow">&rarr;</span>':'<span class="fn '+n.c+'">'+esc(n.t)+'</span>').join('')+'</div></div>'+
      '<div class="callout callout-warn"><span class="callout-icon">!</span><span>Severity: <strong>'+t.severity+'</strong>. '+sevMsg+'</span></div>';
  } else if(key==='examples'){
    h='<p class="sec-title">Attack and defense examples</p>'+
      '<div class="callout callout-red"><span class="callout-icon">!</span><span>For education only. Test just on systems you own or have explicit permission to test, such as the free PortSwigger labs.</span></div>'+
      t.examples.map(ex=>'<div class="ex-block"><div class="ex-title">'+ex.title+'</div><div class="code-wrap"><div class="code-header"><span class="code-lang '+(ex.kind==='good'?'code-label-good':'code-label-atk')+'">'+(ex.kind==='good'?'secure':'payload')+' / '+ex.lang+'</span><button class="copy-code-btn" onclick="copyCode(this)">copy</button></div><div class="code-body"><pre>'+esc(ex.code)+'</pre></div></div></div>').join('');
  } else if(key==='types'){
    h='<p class="sec-title">Variants</p><div class="types-list">'+t.types.map(ty=>'<div class="type-row" style="border-left-color:'+ty.c+'"><div class="tr-name">'+ty.name+'</div><div class="tr-desc">'+ty.desc+'</div></div>').join('')+'</div>';
  } else if(key==='defense'){
    h='<p class="sec-title">How to prevent</p><div class="callout callout-tip"><span class="callout-icon">&#10003;</span><span>Use defense in depth: no single control is enough.</span></div><div class="checklist">'+t.prevention.map(p=>'<div class="cl-item"><span class="ci">&#10003;</span><span>'+p+'</span></div>').join('')+'</div>';
  } else if(key==='quiz'){
    renderQuiz(id); return;
  } else if(key==='refs'){
    h='<p class="sec-title">References and further reading</p>'+
      '<div class="callout callout-info"><span class="callout-icon">&#8599;</span><span>Practice on free, deliberately vulnerable labs at <a href="https://portswigger.net/web-security/all-topics" target="_blank" rel="noopener">PortSwigger Web Security Academy</a>.</span></div><div class="divider"></div><div class="refs-grid">'+
      t.refs.concat([
        {src:'PortSwigger',name:'All topics and free labs',url:'https://portswigger.net/web-security/all-topics'},
        {src:'OWASP',name:'OWASP Top 10',url:'https://owasp.org/www-project-top-ten/'},
        {src:'HackTricks',name:'Pentesting web book',url:'https://book.hacktricks.xyz/'}
      ]).map(r=>{let host='';try{host=new URL(r.url).hostname}catch(e){}return '<a class="ref-card" href="'+r.url+'" target="_blank" rel="noopener"><div class="ref-src">'+r.src+'</div><div class="ref-name">'+r.name+'</div><div class="ref-url">&#8599; '+host+'</div></a>';}).join('')+'</div>';
  }
  tc.innerHTML='<div class="tab-pane">'+h+'</div>';
}

/* ---------- quiz ---------- */
function renderQuiz(id){
  const t=TOPICS.find(x=>x.id===id), st=qState(id), tc=document.getElementById('tab-content');
  if(st.q>=t.quiz.length){
    const pct=Math.round(st.score/t.quiz.length*100);
    const grade=pct>=80?'Solid.':pct>=60?'Getting there.':'Review the material and try again.';
    tc.innerHTML='<div class="tab-pane"><div class="quiz-wrap"><div class="quiz-end"><div class="big-score">'+pct+'%</div><div class="score-sub">'+st.score+' / '+t.quiz.length+' correct. '+grade+'</div><button class="retry-btn" onclick="resetQuiz(\''+id+'\')">retry quiz</button></div></div></div>';
    return;
  }
  const q=t.quiz[st.q], pct=st.q/t.quiz.length*100;
  tc.innerHTML='<div class="tab-pane"><div class="quiz-wrap"><div class="quiz-prog-bar-outer"><div class="quiz-prog-bar-inner" style="width:'+pct+'%"></div></div>'+
    '<div class="quiz-scoreline">Question '+(st.q+1)+' of '+t.quiz.length+' &middot; Score: '+st.score+'</div><div class="quiz-q">'+q.q+'</div><div class="quiz-opts">'+
    q.opts.map((o,i)=>'<button class="quiz-opt" onclick="answerQ(\''+id+'\','+i+')">'+esc(o)+'</button>').join('')+
    '</div><div class="quiz-exp" id="qexp"></div><div class="quiz-footer"><button class="quiz-next-btn" id="qnext" onclick="nextQ(\''+id+'\')">'+(st.q+1===t.quiz.length?'See results':'Next question')+'</button></div></div></div>';
}
function answerQ(id,idx){
  const st=qState(id); if(st.answered) return; st.answered=true;
  const q=TOPICS.find(x=>x.id===id).quiz[st.q];
  const ok=idx===q.ans; if(ok) st.score++;
  document.querySelectorAll('.quiz-opt').forEach((b,i)=>{ b.disabled=true; if(i===q.ans) b.classList.add('correct'); else if(i===idx) b.classList.add('wrong'); });
  const exp=document.getElementById('qexp');
  exp.className='quiz-exp show '+(ok?'correct':'wrong');
  exp.innerHTML='<strong>'+(ok?'Correct.':'Not quite.')+'</strong> '+q.exp;
  document.getElementById('qnext').classList.add('show');
}
function nextQ(id){ const st=qState(id); st.q++; st.answered=false; renderQuiz(id); }
function resetQuiz(id){ quizState[id]={q:0,score:0,answered:false}; renderQuiz(id); }

/* ---------- search ---------- */
function setupSearch(){
  const inp=document.getElementById('searchInp'), drop=document.getElementById('search-drop');
  inp.addEventListener('input',()=>{
    const q=inp.value.toLowerCase().trim();
    if(!q){ drop.classList.remove('open'); return; }
    const hits=TOPICS.filter(t=>t.name.toLowerCase().includes(q)||t.short.toLowerCase().includes(q)||t.tags.some(x=>x.toLowerCase().includes(q))||t.types.some(x=>x.name.toLowerCase().includes(q)||x.desc.toLowerCase().includes(q))).slice(0,7);
    if(!hits.length){ drop.innerHTML='<div class="sdrop-item"><div class="si-desc">No matches</div></div>'; drop.classList.add('open'); return; }
    drop.innerHTML=hits.map(t=>'<div class="sdrop-item" onclick="selectSearch(\''+t.id+'\')"><span class="si-icon">'+t.icon+'</span><div><div class="si-name">'+t.name+'</div><div class="si-desc">'+t.short.substring(0,64)+'</div></div></div>').join('');
    drop.classList.add('open');
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.search-box')) drop.classList.remove('open'); });
}
function selectSearch(id){ document.getElementById('searchInp').value=''; document.getElementById('search-drop').classList.remove('open'); openTopic(id); }

/* ---------- utils ---------- */
function copyCode(btn){
  const text=btn.closest('.code-wrap').querySelector('pre').innerText;
  const done=()=>{ btn.textContent='copied'; setTimeout(()=>btn.textContent='copy',1500); };
  try{ navigator.clipboard.writeText(text).then(done,done); }catch(e){ done(); }
}

/* ---------- init ---------- */
(function init(){
  document.getElementById('n-topics').textContent=TOPICS.length;
  document.getElementById('n-crit').textContent=TOPICS.filter(t=>t.severity==='critical').length;
  document.getElementById('n-ex').textContent=TOPICS.reduce((a,t)=>a+t.examples.length,0);
  document.getElementById('n-q').textContent=TOPICS.reduce((a,t)=>a+t.quiz.length,0);
  buildSidebar(); buildIndex(); setupSearch();
  document.getElementById('filter-all').classList.add('active');
})();
</script>
</body>
</html>
